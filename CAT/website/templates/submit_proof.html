{% extends "base.html" %}

{% block title %}Submit Proof{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Submit Resolution Proof</h2>
            
            <div class="mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Report Details</h3>
                <p class="text-gray-600"><strong>Title:</strong> {{ report.title }}</p>
                <p class="text-gray-600"><strong>Description:</strong> {{ report.description }}</p>
                <p class="text-gray-600"><strong>Location:</strong> {{ report.location }}</p>
            </div>

            <form method="POST" action="{{ url_for('views.submit_proof') }}" enctype="multipart/form-data" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="report_id" value="{{ report.id }}">
                
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Resolution Description</label>
                    <textarea id="description" name="description" rows="4" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500"></textarea>
                </div>

                <!-- Photo Upload Section -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Proof Photo</label>
                    <div class="mt-1 space-y-4">
                        <!-- File Upload Option -->
                        <div>
                            <label for="photo" class="block text-sm text-gray-500 mb-2">Upload from device</label>
                            <input type="file" id="photo" name="photo" accept="image/*" capture="environment"
                                class="block w-full text-sm text-gray-500
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-md file:border-0
                                file:text-sm file:font-semibold
                                file:bg-purple-50 file:text-purple-700
                                hover:file:bg-purple-100">
                        </div>

                        <!-- Camera Capture Option -->
                        <div>
                            <label class="block text-sm text-gray-500 mb-2">Take photo with camera</label>
                            <div class="flex items-center space-x-4">
                                <button type="button" onclick="startCamera()" 
                                    class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                                    Open Camera
                                </button>
                                <button type="button" onclick="stopCamera()" id="stopCameraBtn" class="hidden
                                    px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                                    Close Camera
                                </button>
                            </div>
                            <div id="cameraContainer" class="hidden mt-4">
                                <video id="video" class="w-full rounded-lg" autoplay playsinline></video>
                                <div class="mt-2 flex justify-center">
                                    <button type="button" onclick="capturePhoto()"
                                        class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                                        Capture Photo
                                    </button>
                                </div>
                            </div>
                            <div id="photoPreview" class="hidden mt-4">
                                <img id="preview" class="w-full rounded-lg" alt="Captured photo">
                                <input type="hidden" id="capturedPhoto" name="captured_photo">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-4">
                    <a href="{{ url_for('views.track_resolutions') }}" 
                       class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="px-4 py-2 border border-transparent rounded-md shadow-sm text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                        Submit Proof
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% block javascript %}
<script>
let stream = null;

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById('video');
        video.srcObject = stream;
        document.getElementById('cameraContainer').classList.remove('hidden');
        document.getElementById('stopCameraBtn').classList.remove('hidden');
    } catch (err) {
        console.error('Error accessing camera:', err);
        alert('Could not access camera. Please check your permissions and try again.');
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        document.getElementById('video').srcObject = null;
        document.getElementById('cameraContainer').classList.add('hidden');
        document.getElementById('stopCameraBtn').classList.add('hidden');
    }
}

function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const photoData = canvas.toDataURL('image/jpeg');
    document.getElementById('preview').src = photoData;
    document.getElementById('capturedPhoto').value = photoData;
    document.getElementById('photoPreview').classList.remove('hidden');
    
    // Stop the camera after capturing
    stopCamera();
}

// Clean up camera when leaving the page
window.addEventListener('beforeunload', stopCamera);
</script>
{% endblock %}
{% endblock %}
