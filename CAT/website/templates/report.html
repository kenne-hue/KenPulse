{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Report an Issue</h2>
            
            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="title" name="title" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 sm:text-sm">
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" name="description" rows="3"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 sm:text-sm"></textarea>
                </div>

                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                    <input type="text" id="location" name="location" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-purple-500 focus:ring-purple-500 sm:text-sm">
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-medium text-gray-700">Photo</label>
                    <div class="relative bg-gray-100 rounded-lg overflow-hidden" style="min-height: 200px;">
                        <video id="cameraPreview" class="w-full h-full object-cover hidden"></video>
                        <img id="photoPreview" class="w-full h-full object-cover hidden" alt="Preview">
                        <div id="noCamera" class="absolute inset-0 flex items-center justify-center bg-gray-100">
                            <p class="text-gray-500">Camera access required</p>
                        </div>
                    </div>
                    
                    <div class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-2">
                        <button type="button" id="startCamera" class="w-full sm:w-auto px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                            Open Camera
                        </button>
                        <button type="button" id="capturePhoto" class="w-full sm:w-auto px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 hidden">
                            Take Photo
                        </button>
                        <button type="button" id="retakePhoto" class="w-full sm:w-auto px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 hidden">
                            Retake
                        </button>
                    </div>
                    
                    <input type="file" id="photo" name="photo" accept="image/*" capture="environment" class="hidden">
                </div>

                <div class="flex justify-end">
                    <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                        Submit Report
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% block javascript %}
<script>
    const cameraPreview = document.getElementById('cameraPreview');
    const photoPreview = document.getElementById('photoPreview');
    const noCamera = document.getElementById('noCamera');
    const startCamera = document.getElementById('startCamera');
    const capturePhoto = document.getElementById('capturePhoto');
    const retakePhoto = document.getElementById('retakePhoto');
    const photoInput = document.getElementById('photo');
    let stream = null;

    startCamera.addEventListener('click', async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    facingMode: 'environment',
                    aspectRatio: { ideal: 1.7777777778 } // 16:9
                },
                audio: false 
            });
            
            cameraPreview.srcObject = stream;
            cameraPreview.classList.remove('hidden');
            noCamera.classList.add('hidden');
            startCamera.classList.add('hidden');
            capturePhoto.classList.remove('hidden');
            
            // Ensure video plays
            cameraPreview.onloadedmetadata = () => {
                cameraPreview.play();
            };
        } catch (err) {
            console.error('Error accessing camera:', err);
            noCamera.textContent = 'Camera access denied. Please allow camera access.';
        }
    });

    capturePhoto.addEventListener('click', () => {
        const canvas = document.createElement('canvas');
        canvas.width = cameraPreview.videoWidth;
        canvas.height = cameraPreview.videoHeight;
        canvas.getContext('2d').drawImage(cameraPreview, 0, 0);
        
        // Convert to blob and create file
        canvas.toBlob((blob) => {
            const file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            photoInput.files = dataTransfer.files;
            
            // Show preview
            photoPreview.src = URL.createObjectURL(blob);
            photoPreview.classList.remove('hidden');
            cameraPreview.classList.add('hidden');
            capturePhoto.classList.add('hidden');
            retakePhoto.classList.remove('hidden');
            
            // Stop camera stream
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }, 'image/jpeg', 0.95);
    });

    retakePhoto.addEventListener('click', () => {
        photoPreview.classList.add('hidden');
        retakePhoto.classList.add('hidden');
        startCamera.classList.remove('hidden');
        photoInput.value = '';
    });
</script>
{% endblock %}
{% endblock %}
